server:
  port: 8084

spring:
  application:
    name: reward-delivery-service

  # Kafka配置
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: reward-delivery-group
      auto-offset-reset: earliest
      enable-auto-commit: false

  # MySQL配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/behavioral_reward?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password: root

  # Redis配置
  redis:
    host: localhost
    port: 6379
    database: 0

# Kafka Topic配置
kafka:
  topic:
    reward-delivery: reward-delivery-topic
    notification: notification-topic
    mq-pass: mq-pass-topic

# Sentinel配置
sentinel:
  transport:
    dashboard: localhost:8080

# 日志配置
logging:
  level:
    com.user.growth: INFO

# Actuator监控
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,metrics
  endpoint:
    health:
      show-details: always
